name: Game stability checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:audit
      - run: npm run test:audit
        env:
          SURVIVAL: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-screenshots
          path: test-results
  cross-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/cross-platform.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-platform-evidence
          path: test-results/build45/cross-platform
