name: Game stability checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
